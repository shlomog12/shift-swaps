<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d3557" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="משמרות" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>משמרות וחילופים</title>
    <meta name="description" content="לוח המשמרות של השמירה: לקיחת משמרות פנויות, בקשות חילוף ואישורן." />
    <!-- Link previews (WhatsApp, Telegram, Facebook…). Image URLs must be absolute: %APP_URL% is filled in at build. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="משמרות וחילופים" />
    <meta property="og:title" content="משמרות וחילופים" />
    <meta property="og:description" content="לוח המשמרות של השמירה: יומן משמרות, בקשות חילוף והתנדבות." />
    <meta property="og:url" content="%APP_URL%" />
    <meta property="og:image" content="%APP_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="משמרות וחילופים – לוח המשמרות של השמירה" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
